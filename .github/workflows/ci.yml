name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install quality tools
        run: |
          python -m pip install -e ".[dev]" "pytest>=8,<9"
          python -m pip install "mypy==1.18.2" "ruff==0.15.9"

      - name: Validate YAML
        run: python -m pre_commit run check-yaml --all-files

      - name: Run Ruff lint
        run: python -m ruff check . --no-cache

      - name: Check Ruff formatting
        run: python -m ruff format --check . --no-cache

      - name: Run strict mypy
        run: python -m mypy --strict easyeda2kicad tests setup.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -e ".[dev]" pytest

      - name: Run tests
        run: pytest
