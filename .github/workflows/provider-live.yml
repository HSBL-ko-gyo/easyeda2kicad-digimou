name: Credentialed provider live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-live
  cancel-in-progress: false

jobs:
  provider-live:
    name: DigiKey and Mouser exact-MPN smoke
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: provider-live
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]" "pytest>=8,<9"

      - name: Run credentialed live-provider tests
        env:
          DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
          DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
          MOUSER_API_KEY: ${{ secrets.MOUSER_API_KEY }}
          LIVE_PROVIDER_EVIDENCE_DIR: provider-live-evidence
          PROVIDER_LIVE_COMMIT: ${{ github.sha }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest tests/test_provider_live.py
          -m live_provider --run-live-provider -vv --tb=short

      - name: Validate sanitized evidence and required successes
        if: always()
        env:
          DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
          DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
          MOUSER_API_KEY: ${{ secrets.MOUSER_API_KEY }}
        run: >-
          python -m easyeda2kicad_digimou.live_provider
          --directory provider-live-evidence
          --require-pass digikey
          --require-pass mouser
          --secret-env DIGIKEY_CLIENT_ID
          --secret-env DIGIKEY_CLIENT_SECRET
          --secret-env MOUSER_API_KEY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-live-evidence-${{ github.sha }}
          path: provider-live-evidence/*.json
          if-no-files-found: error
          retention-days: 14
